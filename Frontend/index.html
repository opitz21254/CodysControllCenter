<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Inventory Demo</title>
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header header-bold header-left">2252</div>
        <div class="header header-center">
          VALUE LINE <span class="accent-color">SELECTION 7 OPINION</span>
        </div>
        <div class="header header-bold header-right">OCTOBER 1, 2021</div>
      </div>
      <hr class="hr-thin" />
      <hr class="hr-thick" />
    </header>
    <main>
      <div class="title-container">
        <h2 class="main-title accent-color">
          PORTFOLIO III: STOCKS WITH LONG-TERM PRICE GROWTH POTENTIAL
        </h2>
        <h4 class="main-subtitle">
          Primarily suitable for investors with a 3- to 5-year horizon
        </h4>
      </div>
      <form id="loginForm" class="login-form" autocomplete="off">
        <label for="loginUsername">Username</label>
        <input
          id="loginUsername"
          name="loginUsername"
          type="text"
          autocomplete="username"
          required
        />
        <label for="loginPassword">Password</label>
        <input
          id="loginPassword"
          name="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Log in</button>
        <p id="loginMessage" class="login-message" aria-live="polite"></p>
      </form>

      <table id="inventoryTable" hidden>
        <thead>
          <tr>
            <th>Inventory</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <button id="logoutButton" class="logout-button" type="button" hidden>
        Log out
      </button>

      <script src="service.js"></script>
      <script src="ui.js"></script>
    </main>
  </body>
</html>
